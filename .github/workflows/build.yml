# Builds the release APK with the companion module embedded, so installing the
# single APK is enough: the app installs the companion from its own assets via
# KernelSU when the user confirms the status card.
#
# Stable signing (recommended): add these repository secrets so CI builds can be
# installed over each other and over local debug builds —
#   COOGLE_KEYSTORE_BASE64   base64 of the keystore (e.g. your ~/.android/debug.keystore)
#   COOGLE_STORE_PASSWORD    keystore password (android for the debug keystore)
#   COOGLE_KEY_ALIAS         key alias (androiddebugkey for the debug keystore)
#   COOGLE_KEY_PASSWORD      key password (android for the debug keystore)
# Without the secrets the build falls back to a runner-generated debug keystore;
# such APKs still install, but each CI run has a different signature.
#
# Tag pushes (v*) additionally publish a GitHub Release with the APK and the
# standalone companion ZIP.

name: Build release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to build'
        required: true
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platform-tools' 'build-tools;36.0.0' > /dev/null
          sdkmanager --install 'platforms;android-37.0' || sdkmanager --install 'platforms;android-37'
          # The overlay build script expects the platforms/android-37.0 directory name.
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] && [ -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37" "$ANDROID_HOME/platforms/android-37.0"
          fi

      - name: Prepare keystore
        env:
          COOGLE_KEYSTORE_BASE64: ${{ secrets.COGLE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$COOGLE_KEYSTORE_BASE64" ]; then
            printf '%s' "$COOGLE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            cp "$RUNNER_TEMP/release.keystore" ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            # Keeps the companion overlay build (apksigner) working without secrets.
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build companion module and embed it into the APK assets
        run: |
          python3 companion/build_combined.py
          cp build/Coogle-Companion-*.zip app/src/main/assets/coogle-companion.zip

      # The companion unittest suite hard-codes the maintainer's Windows Git-Bash
      # path and busybox fixtures, so it only runs locally; the ZIP build above is
      # the CI check for the companion.

      - name: Build release APK
        env:
          COOGLE_STORE_PASSWORD: ${{ secrets.COGLE_STORE_PASSWORD }}
          COOGLE_KEY_ALIAS: ${{ secrets.COGLE_KEY_ALIAS }}
          COOGLE_KEY_PASSWORD: ${{ secrets.COGLE_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then
            export COOGLE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Coogle-release.apk
          cp app/src/main/assets/coogle-companion.zip dist/Coogle-Companion.zip

      - uses: actions/upload-artifact@v4
        with:
          name: coogle-release
          path: dist/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Coogle $GITHUB_REF_NAME" --generate-notes \
            'dist/Coogle-release.apk#Coogle-'"${GITHUB_REF_NAME#v}"'-release.apk' \
            'dist/Coogle-Companion.zip#Coogle-Companion-'"${GITHUB_REF_NAME#v}"'.zip'
